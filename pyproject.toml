channels = {version = ">=4.3.1,<5.0.0", extras = ["daphne"]}
drf-spectacular = {version = ">=0.28.0,<0.29.0", extras = ["sidecar"]}
celery = ">=5.5.3,<6.0.0"
python-decouple = ">=3.8,<4.0"
markdown = ">=3.9,<4.0"
django-split-settings = ">=1.3.2,<2.0.0"
django-filter = ">=25.2,<26.0"
django-oauth-toolkit = ">=3.1.0,<4.0.0"
django-service-objects = {git = "https://git.snpdev.ru/saltpepper/django-service-objects.git", branch = "master"}
service-objects-autodocs = {git = "https://git.snpdev.ru/saltpepper/service-objects-autodocs.git", rev = "v1.1.1"}
