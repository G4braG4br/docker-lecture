- name: Ensure directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
  loop:
    - "{{ releases_dir }}"
    - "{{ shared_dir }}/config"
    - "{{ shared_dir }}/logs"
    - "{{ shared_dir }}/static"
    - "{{ shared_dir }}/media"

- name: Set release path
  set_fact:
    release_path: "{{ releases_dir }}/{{ ansible_facts['date_time'].iso8601_basic }}"

